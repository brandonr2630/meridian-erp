<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian ERP — Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F4F5F7;
      --color-ink:     #111827;
      --color-muted:   #4B5563;
      --color-accent:  #A8853A;
      --font-sans:     'DM Sans', system-ui, sans-serif;
      --font-serif:    'Syne', serif;
      --font-mono:     'DM Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Meridian ERP — System Architecture</h1>

    <svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="merp-arch-title merp-arch-desc">
      <title id="merp-arch-title">Meridian ERP system architecture</title>
      <desc id="merp-arch-desc">The single-page browser app talks directly to Supabase for auth and data, persists its session to localStorage, and renders PDFs and Excel exports entirely client-side, with SheetJS lazy-loaded from a CDN only when needed.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4B5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A8853A"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563EB"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F4F5F7"/>

      <!-- ZONES (bg first) -->
      <rect x="40" y="56" width="412" height="280" rx="8" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
      <rect x="56" y="60" width="60" height="12" rx="2" fill="#F4F5F7"/>
      <text x="86" y="69" fill="rgba(17,24,39,0.40)" font-size="7" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT</text>

      <rect x="580" y="56" width="260" height="280" rx="8" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
      <rect x="596" y="60" width="76" height="12" rx="2" fill="#F4F5F7"/>
      <text x="634" y="69" fill="rgba(17,24,39,0.40)" font-size="7" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SUPABASE</text>

      <!-- ARROWS (before nodes) -->

      <!-- A: Browser -> Supabase Auth (straight, shared y) -->
      <path d="M272,108 H612" fill="none" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="416" y="88" width="40" height="12" rx="2" fill="#F4F5F7"/>
      <text x="436" y="97" fill="#2563EB" font-size="8" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTH</text>

      <!-- B: Browser -> Supabase Postgres (accent elbow, primary flow) -->
      <path d="M272,128 H434 Q442,128 442,136 V264 Q442,272 450,272 H612"
            fill="none" stroke="#A8853A" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="500" y="252" width="40" height="12" rx="2" fill="#F4F5F7"/>
      <text x="520" y="261" fill="#A8853A" font-size="8" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRUD</text>

      <!-- E: Browser -> SheetJS (dashed, bridges over B's vertical at x=442) -->
      <path d="M272,148 H434 a8,8 0 0,1 16,0 H462 Q470,148 470,156 V400 Q470,408 478,408 H612"
            fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="360" y="384" width="32" height="12" rx="2" fill="#F4F5F7"/>
      <text x="376" y="393" fill="#7a8399" font-size="8" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.06em">XLSX</text>

      <!-- C: Browser -> localStorage (straight, shared x) -->
      <path d="M152,168 V248" fill="none" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="98" y="198" width="52" height="12" rx="2" fill="#F4F5F7"/>
      <text x="124" y="207" fill="#4B5563" font-size="8" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION</text>

      <!-- D: Browser -> PDF Renderer (elbow) -->
      <path d="M212,168 V200 Q212,208 220,208 H344 Q352,208 352,216 V248"
            fill="none" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="228" y="186" width="48" height="12" rx="2" fill="#F4F5F7"/>
      <text x="252" y="195" fill="#4B5563" font-size="8" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RENDER</text>

      <!-- NODES -->

      <!-- Browser SPA (FOCAL) -->
      <rect x="72" y="88" width="200" height="80" rx="6" fill="#F4F5F7"/>
      <rect x="72" y="88" width="200" height="80" rx="6" fill="rgba(168,133,58,0.08)" stroke="#A8853A" stroke-width="1"/>
      <rect x="80" y="96" width="32" height="12" rx="2" fill="transparent" stroke="rgba(168,133,58,0.8)" stroke-width="0.8"/>
      <text x="96" y="105" fill="#A8853A" font-size="7" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
      <text x="172" y="134" fill="#111827" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Meridian ERP</text>
      <text x="172" y="150" fill="#4B5563" font-size="9" font-family="'DM Mono', monospace" text-anchor="middle">index.html · 8.4k lines</text>

      <!-- Supabase Auth -->
      <rect x="612" y="92" width="200" height="72" rx="6" fill="#F4F5F7"/>
      <rect x="612" y="92" width="200" height="72" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
      <rect x="620" y="100" width="34" height="12" rx="2" fill="transparent" stroke="rgba(17,24,39,0.40)" stroke-width="0.8"/>
      <text x="637" y="109" fill="rgba(17,24,39,0.8)" font-size="7" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="712" y="136" fill="#111827" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Supabase Auth</text>
      <text x="712" y="152" fill="#4B5563" font-size="9" font-family="'DM Mono', monospace" text-anchor="middle">JWT · email + OAuth</text>

      <!-- Supabase Postgres (FOCAL) -->
      <rect x="612" y="232" width="200" height="80" rx="6" fill="#F4F5F7"/>
      <rect x="612" y="232" width="200" height="80" rx="6" fill="rgba(168,133,58,0.08)" stroke="#A8853A" stroke-width="1"/>
      <rect x="620" y="240" width="24" height="12" rx="2" fill="transparent" stroke="rgba(168,133,58,0.8)" stroke-width="0.8"/>
      <text x="632" y="249" fill="#A8853A" font-size="7" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="712" y="278" fill="#111827" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Supabase Postgres</text>
      <text x="712" y="294" fill="#4B5563" font-size="9" font-family="'DM Mono', monospace" text-anchor="middle">multi-company · RLS</text>

      <!-- localStorage (store) -->
      <rect x="72" y="248" width="160" height="64" rx="6" fill="#F4F5F7"/>
      <rect x="72" y="248" width="160" height="64" rx="6" fill="rgba(17,24,39,0.05)" stroke="#4B5563" stroke-width="1"/>
      <rect x="80" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(75,85,99,0.5)" stroke-width="0.8"/>
      <text x="94" y="265" fill="#4B5563" font-size="7" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LS</text>
      <text x="152" y="290" fill="#111827" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">localStorage</text>

      <!-- PDF Renderer -->
      <rect x="272" y="248" width="160" height="64" rx="6" fill="#F4F5F7"/>
      <rect x="272" y="248" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
      <rect x="280" y="256" width="30" height="12" rx="2" fill="transparent" stroke="rgba(17,24,39,0.40)" stroke-width="0.8"/>
      <text x="295" y="265" fill="rgba(17,24,39,0.8)" font-size="7" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PDF</text>
      <text x="352" y="290" fill="#111827" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">PDF Renderer</text>

      <!-- SheetJS (optional / external, dashed) -->
      <rect x="612" y="376" width="200" height="64" rx="6" fill="#F4F5F7"/>
      <rect x="612" y="376" width="200" height="64" rx="6" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="620" y="384" width="30" height="12" rx="2" fill="transparent" stroke="rgba(17,24,39,0.30)" stroke-width="0.8"/>
      <text x="635" y="393" fill="rgba(17,24,39,0.6)" font-size="7" font-family="'DM Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
      <text x="712" y="412" fill="#111827" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">SheetJS</text>
      <text x="712" y="428" fill="#4B5563" font-size="9" font-family="'DM Mono', monospace" text-anchor="middle">lazy-loaded on export</text>

      <!-- LEGEND -->
      <line x1="40" y1="480" x2="880" y2="480" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
      <text x="40" y="496" fill="#4B5563" font-size="8" font-family="'DM Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="489" width="10" height="10" rx="2" fill="rgba(168,133,58,0.08)" stroke="#A8853A" stroke-width="1"/>
      <text x="156" y="497" fill="#4B5563" font-size="8" font-family="'DM Mono', monospace">Focal</text>

      <rect x="230" y="489" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
      <text x="246" y="497" fill="#4B5563" font-size="8" font-family="'DM Mono', monospace">Backend</text>

      <rect x="330" y="489" width="10" height="10" rx="2" fill="rgba(17,24,39,0.05)" stroke="#4B5563" stroke-width="1"/>
      <text x="346" y="497" fill="#4B5563" font-size="8" font-family="'DM Mono', monospace">Store</text>

      <rect x="420" y="489" width="10" height="10" rx="2" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="436" y="497" fill="#4B5563" font-size="8" font-family="'DM Mono', monospace">External / lazy</text>

      <line x1="560" y1="494" x2="590" y2="494" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="598" y="497" fill="#4B5563" font-size="8" font-family="'DM Mono', monospace">HTTP / Auth</text>

      <line x1="700" y1="494" x2="730" y2="494" stroke="#A8853A" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="738" y="497" fill="#4B5563" font-size="8" font-family="'DM Mono', monospace">Primary data</text>
    </svg>
  </div>
</body>
</html>
